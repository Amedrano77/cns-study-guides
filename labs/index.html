<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Labs · TSTC CNS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif;
            background: #f5f7fa; color: #1e293b; min-height: 100vh;
        }
        header {
            background: #0f2b3d; color: white; padding: 2rem 2rem 1.5rem;
            text-align: center; border-bottom: 6px solid #b91c1c;
            position: relative; overflow: hidden;
        }
        header::before {
            content: ''; position: absolute; inset: 0;
            background: repeating-linear-gradient(45deg, transparent, transparent 40px,
                rgba(255,255,255,0.02) 40px, rgba(255,255,255,0.02) 80px);
        }
        header .logo { font-size: 2.5rem; margin-bottom: 0.4rem; position: relative; }
        header h1 { font-size: 2.2rem; font-weight: 700; position: relative; }
        header p { color: #94a3b8; margin-top: 0.3rem; position: relative; }
        .back-link {
            display: inline-block; margin-top: 0.75rem; color: #facc15;
            text-decoration: none; font-size: 0.9rem; font-weight: 600; position: relative;
        }
        .back-link:hover { text-decoration: underline; }

        /* COURSE SELECTOR */
        main { max-width: 1200px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
        .course-selector {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 0.75rem; margin-bottom: 2.5rem;
        }
        .course-btn {
            padding: 0.75rem 0.5rem; border-radius: 14px; border: 2px solid #e2e8f0;
            background: white; cursor: pointer; text-align: center; font-family: inherit;
            transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,20,30,0.06);
        }
        .course-btn:hover { border-color: #b91c1c; transform: translateY(-2px); }
        .course-btn.active { border-color: #b91c1c; background: #fff5f5; }
        .course-btn .ci { font-size: 1.5rem; display: block; margin-bottom: 0.3rem; }
        .course-btn .cn { font-size: 0.8rem; font-weight: 700; color: #0f2b3d; display: block; }
        .course-btn .cc { font-size: 0.7rem; color: #64748b; display: block; margin-top: 0.1rem; }
        .course-btn .cp { margin-top: 0.5rem; height: 4px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
        .course-btn .cpf { height: 100%; background: #b91c1c; border-radius: 999px; transition: width 0.3s; }

        /* COURSE PANEL */
        .course-panel { display: none; }
        .course-panel.active { display: block; }

        /* PANEL HEADER */
        .panel-header {
            background: white; border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,20,30,0.08);
            padding: 1.5rem 2rem; margin-bottom: 1.5rem;
            display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;
        }
        .panel-title { font-size: 1.5rem; font-weight: 700; color: #0f2b3d; flex: 1; }
        .panel-stats { display: flex; gap: 1rem; flex-wrap: wrap; }
        .pstat {
            text-align: center; background: #f8fafc; border-radius: 10px;
            padding: 0.5rem 1rem; min-width: 80px;
        }
        .pstat-num { font-size: 1.3rem; font-weight: 700; color: #b91c1c; }
        .pstat-label { font-size: 0.72rem; color: #64748b; text-transform: uppercase; }

        /* FILTER BAR */
        .filter-bar {
            display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem;
        }
        .filter-btn {
            padding: 0.4rem 0.9rem; border-radius: 999px; border: 2px solid #e2e8f0;
            background: white; cursor: pointer; font-family: inherit; font-size: 0.85rem;
            font-weight: 600; color: #64748b; transition: all 0.2s;
        }
        .filter-btn:hover { border-color: #b91c1c; color: #b91c1c; }
        .filter-btn.active { background: #b91c1c; border-color: #b91c1c; color: white; }

        /* LAB CARDS */
        .labs-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.25rem;
        }
        .lab-card {
            background: white; border-radius: 18px;
            box-shadow: 0 3px 14px rgba(0,20,30,0.08);
            overflow: hidden; display: flex; flex-direction: column;
            border: 2px solid transparent; transition: all 0.2s;
        }
        .lab-card:hover { border-color: #b91c1c; transform: translateY(-2px); }
        .lab-card.completed { border-color: #16a34a; }

        .lab-card-header {
            padding: 1.1rem 1.25rem 0.75rem;
            border-bottom: 2px solid #f1f5f9;
        }
        .lab-top { display: flex; align-items: flex-start; gap: 0.75rem; margin-bottom: 0.6rem; }
        .lab-num {
            background: #0f2b3d; color: #facc15; font-size: 0.75rem; font-weight: 700;
            padding: 0.2rem 0.5rem; border-radius: 6px; flex-shrink: 0; margin-top: 2px;
        }
        .lab-title { font-size: 1rem; font-weight: 700; color: #0f2b3d; line-height: 1.3; flex: 1; }
        .lab-badges { display: flex; gap: 0.4rem; flex-wrap: wrap; }
        .badge {
            font-size: 0.68rem; font-weight: 700; padding: 0.15rem 0.5rem;
            border-radius: 999px; text-transform: uppercase; letter-spacing: 0.03em;
        }
        .diff-beginner { background: #dcfce7; color: #15803d; }
        .diff-intermediate { background: #fef9c3; color: #a16207; }
        .diff-advanced { background: #fee2e2; color: #b91c1c; }
        .tool-pt { background: #dbeafe; color: #1d4ed8; }
        .tool-vm { background: #ede9fe; color: #6d28d9; }
        .tool-win { background: #e0f2fe; color: #0369a1; }
        .tool-aws { background: #fff7ed; color: #c2410c; }
        .tool-py { background: #fef9c3; color: #854d0e; }
        .tool-linux { background: #dcfce7; color: #166534; }
        .tool-proxmox { background: #fdf4ff; color: #7e22ce; }
        .time-badge { background: #f1f5f9; color: #475569; }

        .lab-card-body { padding: 0.75rem 1.25rem; flex: 1; }
        .lab-desc { font-size: 0.88rem; color: #475569; line-height: 1.5; margin-bottom: 0.75rem; }

        .lab-objectives { list-style: none; margin: 0; }
        .lab-objectives li {
            font-size: 0.82rem; color: #64748b; padding: 0.2rem 0;
            border-bottom: 1px dashed #f1f5f9; display: flex; align-items: flex-start; gap: 0.4rem;
        }
        .lab-objectives li:last-child { border-bottom: none; }
        .lab-objectives li::before { content: "▸"; color: #b91c1c; font-weight: bold; flex-shrink: 0; }

        /* LAB STEPS (expandable) */
        .lab-steps-toggle {
            width: 100%; padding: 0.6rem 1.25rem; background: #f8fafc; border: none;
            border-top: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9;
            text-align: left; font-family: inherit; font-size: 0.83rem; font-weight: 600;
            color: #1e3a5f; cursor: pointer; display: flex; justify-content: space-between;
            align-items: center;
        }
        .lab-steps-toggle:hover { background: #f1f5f9; }
        .steps-arrow { transition: transform 0.2s; font-size: 0.75rem; }
        .steps-arrow.open { transform: rotate(90deg); }

        .lab-steps-body {
            display: none; padding: 0.75rem 1.25rem;
            background: #0f172a; border-bottom: 1px solid #1e293b;
        }
        .step {
            display: flex; gap: 0.75rem; margin-bottom: 0.75rem; align-items: flex-start;
        }
        .step:last-child { margin-bottom: 0; }
        .step-num {
            background: #b91c1c; color: white; font-size: 0.72rem; font-weight: 700;
            width: 20px; height: 20px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
        }
        .step-text { font-size: 0.83rem; color: #e2e8f0; line-height: 1.5; flex: 1; }
        .step-text code {
            background: #1e293b; color: #facc15; padding: 0.1rem 0.4rem;
            border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem;
        }

        .lab-card-footer { padding: 0.75rem 1.25rem; }
        .btn-complete {
            width: 100%; padding: 0.65rem; border-radius: 10px; border: none;
            font-family: inherit; font-size: 0.9rem; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
            background: #0f2b3d; color: white;
        }
        .btn-complete:hover { background: #1e3a5f; }
        .btn-complete.done { background: #16a34a; color: white; }
        .btn-complete.done:hover { background: #15803d; }

        .no-labs { text-align: center; padding: 3rem; color: #94a3b8; display: none; }

        @media (max-width: 700px) {
            .labs-grid { grid-template-columns: 1fr; }
            .course-selector { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>

// ============================================================
//  RENDER
// ============================================================
function init() {
    const saved = JSON.parse(localStorage.getItem('cns_labs') || '{}');

    const sel = document.getElementById('courseSelector');
    const panels = document.getElementById('coursePanels');

    courses.forEach(course => {
        const total = course.labs.length;
        const done = course.labs.filter((_, i) => saved[`${course.id}_${i}`]).length;
        const pct = total > 0 ? Math.round((done / total) * 100) : 0;

        // Selector button
        const btn = document.createElement('button');
        btn.className = 'course-btn';
        btn.id = `cbtn_${course.id}`;
        btn.onclick = () => showCourse(course.id);
        btn.innerHTML = `<span class="ci">${course.icon}</span><span class="cn">${course.name}</span><span class="cc">${course.code}</span><div class="cp"><div class="cpf" id="cpf_${course.id}" style="width:${pct}%"></div></div>`;
        sel.appendChild(btn);

        // Panel
        const panel = document.createElement('div');
        panel.className = 'course-panel';
        panel.id = `panel_${course.id}`;

        const panelHtml = `
            <div class="panel-header">
                <div class="panel-title">${course.icon} ${course.name} — ${course.code} Labs</div>
                <div class="panel-stats">
                    <div class="pstat"><div class="pstat-num">${total}</div><div class="pstat-label">Labs</div></div>
                    <div class="pstat"><div class="pstat-num" id="done_${course.id}">${done}</div><div class="pstat-label">Done</div></div>
                    <div class="pstat"><div class="pstat-num" id="pct_${course.id}">${pct}%</div><div class="pstat-label">Complete</div></div>
                </div>
            </div>
            <div class="filter-bar">
                <button class="filter-btn active" onclick="filterLabs('${course.id}', 'all', this)">All</button>
                <button class="filter-btn" onclick="filterLabs('${course.id}', 'beginner', this)">🟢 Beginner</button>
                <button class="filter-btn" onclick="filterLabs('${course.id}', 'intermediate', this)">🟡 Intermediate</button>
                <button class="filter-btn" onclick="filterLabs('${course.id}', 'advanced', this)">🔴 Advanced</button>
                <button class="filter-btn" onclick="filterLabs('${course.id}', 'incomplete', this)">⬜ Not Done</button>
                <button class="filter-btn" onclick="filterLabs('${course.id}', 'complete', this)">✅ Done</button>
            </div>
            <div class="labs-grid" id="grid_${course.id}">
                ${course.labs.map((lab, i) => renderLabCard(course.id, lab, i, saved)).join('')}
            </div>
            <div class="no-labs" id="nolabs_${course.id}">No labs match this filter.</div>`;

        panel.innerHTML = panelHtml;
        panels.appendChild(panel);
    });

    showCourse(courses[0].id);
}

function renderLabCard(courseId, lab, idx, saved) {
    const key = `${courseId}_${idx}`;
    const isComplete = !!saved[key];
    const toolClass = { pt: 'tool-pt', vm: 'tool-vm', win: 'tool-win', aws: 'tool-aws', py: 'tool-py', linux: 'tool-linux', proxmox: 'tool-proxmox' }[lab.tool] || 'tool-win';
    const toolLabel = { pt: 'Packet Tracer', vm: 'Virtual Machine', win: 'Windows', aws: 'AWS Free Tier', py: 'Python/VS Code', linux: 'Linux VM', proxmox: 'Proxmox VE' }[lab.tool] || lab.tool;
    const stepsHtml = lab.steps.map((s, si) => `<div class="step"><div class="step-num">${si + 1}</div><div class="step-text">${s.text}</div></div>`).join('');

    return `
        <div class="lab-card ${isComplete ? 'completed' : ''}" id="card_${courseId}_${idx}" data-diff="${lab.diff}" data-complete="${isComplete}">
            <div class="lab-card-header">
                <div class="lab-top">
                    <span class="lab-num">Lab ${idx + 1}</span>
                    <span class="lab-title">${lab.title}</span>
                </div>
                <div class="lab-badges">
                    <span class="badge diff-${lab.diff}">${lab.diff}</span>
                    <span class="badge ${toolClass}">${toolLabel}</span>
                    <span class="badge time-badge">⏱ ${lab.time}</span>
                </div>
            </div>
            <div class="lab-card-body">
                <div class="lab-desc">${lab.desc}</div>
                <ul class="lab-objectives">${lab.objectives.map(o => `<li>${o}</li>`).join('')}</ul>
            </div>
            <button class="lab-steps-toggle" onclick="toggleSteps(this)">
                📋 View Step-by-Step Instructions <span class="steps-arrow">▶</span>
            </button>
            <div class="lab-steps-body">${stepsHtml}</div>
            <div class="lab-card-footer">
                <button class="btn-complete ${isComplete ? 'done' : ''}" onclick="toggleComplete('${courseId}', ${idx}, this)">
                    ${isComplete ? '✅ Completed — Click to Undo' : '⬜ Mark as Complete'}
                </button>
            </div>
        </div>`;
}

function toggleSteps(btn) {
    const body = btn.nextElementSibling;
    const arrow = btn.querySelector('.steps-arrow');
    const isOpen = body.style.display === 'block';
    body.style.display = isOpen ? 'none' : 'block';
    arrow.classList.toggle('open', !isOpen);
}

function toggleComplete(courseId, idx, btn) {
    const saved = JSON.parse(localStorage.getItem('cns_labs') || '{}');
    const key = `${courseId}_${idx}`;
    const isDone = !saved[key];
    saved[key] = isDone;
    localStorage.setItem('cns_labs', JSON.stringify(saved));

    const card = document.getElementById(`card_${courseId}_${idx}`);
    card.classList.toggle('completed', isDone);
    card.dataset.complete = isDone;
    btn.className = `btn-complete ${isDone ? 'done' : ''}`;
    btn.textContent = isDone ? '✅ Completed — Click to Undo' : '⬜ Mark as Complete';

    updateProgress(courseId);
}

function updateProgress(courseId) {
    const course = courses.find(c => c.id === courseId);
    const saved = JSON.parse(localStorage.getItem('cns_labs') || '{}');
    const done = course.labs.filter((_, i) => saved[`${courseId}_${i}`]).length;
    const pct = Math.round((done / course.labs.length) * 100);

    const doneEl = document.getElementById(`done_${courseId}`);
    const pctEl = document.getElementById(`pct_${courseId}`);
    const fill = document.getElementById(`cpf_${courseId}`);
    if (doneEl) doneEl.textContent = done;
    if (pctEl) pctEl.textContent = pct + '%';
    if (fill) fill.style.width = pct + '%';
}

function filterLabs(courseId, filter, btn) {
    document.querySelectorAll(`#panel_${courseId} .filter-btn`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const cards = document.querySelectorAll(`#grid_${courseId} .lab-card`);
    let visible = 0;
    cards.forEach(card => {
        let show = true;
        if (filter === 'beginner' && card.dataset.diff !== 'beginner') show = false;
        if (filter === 'intermediate' && card.dataset.diff !== 'intermediate') show = false;
        if (filter === 'advanced' && card.dataset.diff !== 'advanced') show = false;
        if (filter === 'complete' && card.dataset.complete !== 'true') show = false;
        if (filter === 'incomplete' && card.dataset.complete === 'true') show = false;
        card.style.display = show ? '' : 'none';
        if (show) visible++;
    });

    const noLabs = document.getElementById(`nolabs_${courseId}`);
    if (noLabs) noLabs.style.display = visible === 0 ? 'block' : 'none';
}

function showCourse(id) {
    document.querySelectorAll('.course-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.course-panel').forEach(p => p.classList.remove('active'));
    document.getElementById(`cbtn_${id}`).classList.add('active');
    document.getElementById(`panel_${id}`).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

init();
</script>
