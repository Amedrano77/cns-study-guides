        /* HEADER */
        header {

        }
        header::before {
            content: ''; position: absolute; inset: 0;

        }
        header .logo { font-size: 2.5rem; margin-bottom: 0.4rem; position: relative; }
        header h1 { font-size: 2.2rem; font-weight: 700; position: relative; }
        header p { color: #94a3b8; margin-top: 0.3rem; position: relative; }
        .back-link {
            display: inline-block; margin-top: 0.75rem; color: #facc15;
            text-decoration: none; font-size: 0.9rem; font-weight: 600; position: relative;
        }
        .back-link:hover { text-decoration: underline; }

        /* MAIN */
        main { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

        /* CERT SELECTOR */
        .cert-selector {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 0.75rem; margin-bottom: 2.5rem;
        }
        .cert-btn {
            padding: 0.75rem 0.5rem; border-radius: 14px; border: 2px solid #e2e8f0;
            background: white; cursor: pointer; text-align: center; font-family: inherit;
            transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,20,30,0.06);
        }
        .cert-btn:hover { border-color: #b91c1c; transform: translateY(-2px); }
        .cert-btn.active { border-color: #b91c1c; background: #fff5f5; box-shadow: 0 4px 16px rgba(185,28,28,0.15); }
        .cert-btn .cert-icon { font-size: 1.6rem; display: block; margin-bottom: 0.3rem; }
        .cert-btn .cert-name { font-size: 0.82rem; font-weight: 700; color: #0f2b3d; display: block; }
        .cert-btn .cert-code { font-size: 0.72rem; color: #64748b; display: block; margin-top: 0.1rem; }
        .cert-btn .cert-progress {
            margin-top: 0.5rem; height: 5px; background: #e2e8f0; border-radius: 999px; overflow: hidden;
        }
        .cert-btn .cert-progress-fill { height: 100%; background: #b91c1c; border-radius: 999px; transition: width 0.3s; }

        /* CHECKLIST PANEL */
        .checklist-panel { display: none; }
        .checklist-panel.active { display: block; }

            background: white; border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,20,30,0.08);
            padding: 1.75rem 2rem; margin-bottom: 1.5rem;
            display: flex; align-items: center; gap: 2rem; flex-wrap: wrap;

        .readiness-info { flex: 1; min-width: 200px; }
        .readiness-title { font-size: 1.5rem; font-weight: 700; color: #0f2b3d; }
        .readiness-sub { color: #64748b; font-size: 0.9rem; margin-top: 0.25rem; }
        .readiness-score-wrap { text-align: center; }
        .readiness-circle {
            width: 100px; height: 100px; border-radius: 50%;
            border: 8px solid #e2e8f0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; margin: 0 auto 0.5rem;
            transition: border-color 0.4s;
        }
        .readiness-pct { font-size: 1.6rem; font-weight: 700; color: #0f2b3d; line-height: 1; }
        .readiness-label { font-size: 0.72rem; color: #64748b; text-transform: uppercase; }
        .readiness-status {
            font-size: 0.85rem; font-weight: 700; padding: 0.3rem 0.8rem;
            border-radius: 999px; display: inline-block;
        }
        .status-not-ready { background: #fee2e2; color: #b91c1c; }
        .status-getting-there { background: #fef9c3; color: #a16207; }
        .status-almost { background: #dbeafe; color: #1d4ed8; }
        .status-ready { background: #dcfce7; color: #15803d; }

        .readiness-bar-wrap { flex: 2; min-width: 250px; }
        .readiness-bar-label { font-size: 0.8rem; color: #64748b; margin-bottom: 0.4rem; display: flex; justify-content: space-between; }
        .readiness-bar { height: 14px; background: #e2e8f0; border-radius: 999px; overflow: hidden; }
        .readiness-bar-fill { height: 100%; background: #b91c1c; border-radius: 999px; transition: width 0.4s ease; }

        .btn-reset {
            background: white; border: 2px solid #e2e8f0; color: #64748b;
            padding: 0.4rem 0.9rem; border-radius: 8px; font-size: 0.82rem;
            font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.2s;
        }
        .btn-reset:hover { border-color: #b91c1c; color: #b91c1c; }

        /* EXAM INFO BAR */
        .exam-info {
            display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem;
        }
        .exam-info-item {
            background: white; border-radius: 12px; padding: 0.75rem 1.25rem;
            box-shadow: 0 2px 8px rgba(0,20,30,0.06); font-size: 0.85rem;
            display: flex; align-items: center; gap: 0.5rem; flex: 1; min-width: 140px;

        .exam-info-text { color: #475569; }
        .exam-info-text strong { color: #0f2b3d; display: block; font-size: 0.9rem; }

            background: white; border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,20,30,0.08);
            margin-bottom: 1.25rem; overflow: hidden;

            width: 100%; padding: 1.1rem 1.5rem; background: none; border: none;

        .toggle-icon { font-size: 1.3rem; }
        .toggle-title { font-size: 1.05rem; font-weight: 700; color: #0f2b3d; flex: 1; }
        .toggle-count {
            font-size: 0.8rem; font-weight: 600; padding: 0.2rem 0.6rem;
            border-radius: 999px; background: #f1f5f9; color: #64748b;
        }
        .toggle-arrow { color: #94a3b8; transition: transform 0.2s; font-size: 0.9rem; }
        .toggle-arrow.open { transform: rotate(90deg); }
        .section-body { padding: 0.5rem 0; }

        /* CHECKLIST ITEMS */
        .check-item {
            display: flex; align-items: flex-start; gap: 0.75rem;
            padding: 0.6rem 1.5rem; transition: background 0.15s; cursor: pointer;
        }
        .check-item:hover { background: #fafafa; }
        .check-item input[type="checkbox"] { display: none; }
        .check-item * { pointer-events: none; }
        .check-box {
            width: 20px; height: 20px; border-radius: 6px; border: 2px solid #d1d5db;
            flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; margin-top: 2px; background: white;
        }
        .check-item.checked .check-box {
            background: #16a34a; border-color: #16a34a;
        }
        .check-item.checked .check-box::after {
            content: '✓'; color: white; font-size: 0.75rem; font-weight: 700;
        }
        .check-text { flex: 1; }
        .check-title {
            font-size: 0.92rem; color: #1e293b; line-height: 1.4;
            transition: color 0.2s;
        }
        .check-item.checked .check-title { color: #9ca3af; text-decoration: line-through; }
        .check-hint { font-size: 0.78rem; color: #94a3b8; margin-top: 0.2rem; }
        .check-priority {
            font-size: 0.68rem; font-weight: 700; padding: 0.1rem 0.4rem;
            border-radius: 4px; flex-shrink: 0; margin-top: 3px; text-transform: uppercase;
        }
        .priority-high { background: #fee2e2; color: #b91c1c; }
        .priority-med { background: #fef9c3; color: #a16207; }
        .priority-low { background: #f1f5f9; color: #64748b; }

        .exam-tips {
            background: #fff9e6; border-left: 8px solid #fbbf24; border-radius: 0 16px 16px 0;

        .exam-tips li { font-size: 0.9rem; color: #78350f; margin-bottom: 0.3rem; }

            .readiness-header { flex-direction: column; gap: 1rem; }
            header h1 { font-size: 1.7rem; }
        }
    </style>

// ============================================================
//  RENDER
// ============================================================
function init() {
    const saved = JSON.parse(localStorage.getItem('cns_checklist') || '{}');

    // Build selector
    const sel = document.getElementById('certSelector');
    certs.forEach(cert => {
        const total = cert.sections.reduce((a, s) => a + s.items.length, 0);
        const done = Object.keys(saved).filter(k => k.startsWith(cert.id + '_') && saved[k]).length;
        const pct = total > 0 ? Math.round((done / total) * 100) : 0;

        const btn = document.createElement('button');
        btn.className = 'cert-btn';
        btn.id = 'btn_' + cert.id;
        btn.onclick = () => showCert(cert.id);
        btn.innerHTML = `
            <span class="cert-icon">${cert.icon}</span>
            <span class="cert-name">${cert.name}</span>
            <span class="cert-code">${cert.code}</span>
            <div class="cert-progress"><div class="cert-progress-fill" id="mini_${cert.id}" style="width:${pct}%"></div></div>`;
        sel.appendChild(btn);
    });

    // Build panels
    const panels = document.getElementById('checklistPanels');
    certs.forEach(cert => {
        const total = cert.sections.reduce((a, s) => a + s.items.length, 0);
        const panel = document.createElement('div');
        panel.className = 'checklist-panel';
        panel.id = 'panel_' + cert.id;

        // Voucher info
        const voucherHtml = `
            <div class="voucher-box">
                <h3>🎫 Exam Information & Registration</h3>
                <p>Register at <a href="${cert.link}" target="_blank">Pearson VUE</a> when you're ready.
                Ask your instructor about TSTC student voucher discounts before purchasing at full price.</p>
            </div>`;

        // Tips
        const tipsHtml = `
            <div class="exam-tips">
                <h3>✍️ Exam Day Strategy Tips</h3>
                <ul>${cert.tips.map(t => `<li>${t}</li>`).join('')}</ul>
            </div>`;

        // Sections
        const sectionsHtml = cert.sections.map((sec, si) => {
                            const itemsHtml = sec.items.map((item, ii) => {
                const key = `${cert.id}_${si}_${ii}`;
                const checked = saved[key] ? 'checked' : '';
                return `
                    <div class="check-item ${checked}" onclick="toggleItem(this, '${key}', '${cert.id}', ${total})">
                        <div class="check-box"></div>
                        <div class="check-text">
                            <div class="check-title">${item.text}</div>
                            ${item.hint ? `<div class="check-hint">💡 ${item.hint}</div>` : ''}
                        </div>
                        <span class="check-priority priority-${item.priority}">${item.priority}</span>
                    </div>`;
            }).join('');

            const secTotal = sec.items.length;
            return `
                <div class="checklist-section">
                    <button class="section-toggle" onclick="toggleSection(this)">
                        <span class="toggle-icon">${sec.icon}</span>
                        <span class="toggle-title">${sec.title}</span>
                        <span class="toggle-count" id="count_${cert.id}_${si}">${secTotal} items</span>
                        <span class="toggle-arrow open">▶</span>
                    </button>
                    <div class="section-body">${itemsHtml}</div>
                </div>`;
        }).join('');

        panel.innerHTML = `
            <div class="readiness-header">
                <div class="readiness-info">
                    <div class="readiness-title">${cert.icon} ${cert.name}</div>
                    <div class="readiness-sub">${cert.code} · ${cert.examMins} min · ${cert.questions} · Pass: ${cert.passingScore}</div>
                </div>
                <div class="readiness-bar-wrap">
                    <div class="readiness-bar-label">
                        <span>Study Progress</span>
                        <span id="pct_${cert.id}">0%</span>
                    </div>
                    <div class="readiness-bar">
                        <div class="readiness-bar-fill" id="bar_${cert.id}" style="width:0%"></div>
                    </div>
                </div>
                <div class="readiness-score-wrap">
                    <div class="readiness-circle" id="circle_${cert.id}">
                        <div class="readiness-pct" id="rpct_${cert.id}">0%</div>
                        <div class="readiness-label">Ready</div>
                    </div>
                    <div id="status_${cert.id}" class="readiness-status status-not-ready">Not Ready Yet</div>
                </div>
                <button class="btn-reset" onclick="resetCert('${cert.id}', ${total})">↺ Reset</button>
            </div>
            <div class="exam-info">
                <div class="exam-info-item"><span class="exam-info-icon">⏱️</span><div class="exam-info-text"><strong>${cert.examMins} minutes</strong>Exam time limit</div></div>
                <div class="exam-info-item"><span class="exam-info-icon">❓</span><div class="exam-info-text"><strong>${cert.questions}</strong>Max questions</div></div>
                <div class="exam-info-item"><span class="exam-info-icon">🎯</span><div class="exam-info-text"><strong>${cert.passingScore}</strong>Passing score</div></div>
                <div class="exam-info-item"><span class="exam-info-icon">💰</span><div class="exam-info-text"><strong>${cert.examFee}</strong>Exam fee</div></div>
            </div>
            ${voucherHtml}
            ${sectionsHtml}
            ${tipsHtml}`;

        panels.appendChild(panel);
        updateProgress(cert.id, total);
    });

    // Show first cert by default
    showCert(certs[0].id);
}

function showCert(id) {
    document.querySelectorAll('.cert-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.checklist-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('btn_' + id).classList.add('active');
    document.getElementById('panel_' + id).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function toggleItem(label, key, certId, total) {
    const isChecked = !label.classList.contains('checked');
    if (isChecked) {
        label.classList.add('checked');
    } else {
        label.classList.remove('checked');
    }
    const saved = JSON.parse(localStorage.getItem('cns_checklist') || '{}');
    saved[key] = isChecked;
    localStorage.setItem('cns_checklist', JSON.stringify(saved));
    updateProgress(certId, total);
}

function updateProgress(certId, total) {
    const saved = JSON.parse(localStorage.getItem('cns_checklist') || '{}');
    const done = Object.keys(saved).filter(k => k.startsWith(certId + '_') && saved[k]).length;
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;

    const bar = document.getElementById('bar_' + certId);
    const pctEl = document.getElementById('pct_' + certId);
    const rpct = document.getElementById('rpct_' + certId);
    const circle = document.getElementById('circle_' + certId);
    const status = document.getElementById('status_' + certId);
    const mini = document.getElementById('mini_' + certId);

    if (bar) bar.style.width = pct + '%';
    if (pctEl) pctEl.textContent = pct + '%';
    if (rpct) rpct.textContent = pct + '%';
    if (mini) mini.style.width = pct + '%';

    if (circle) {
        if (pct >= 90) { circle.style.borderColor = '#16a34a'; }
        else if (pct >= 70) { circle.style.borderColor = '#2563eb'; }
        else if (pct >= 40) { circle.style.borderColor = '#ca8a04'; }
        else { circle.style.borderColor = '#e2e8f0'; }
    }

    if (status) {
        status.className = 'readiness-status';
        if (pct >= 90) { status.classList.add('status-ready'); status.textContent = '✅ Ready to Test!'; }
        else if (pct >= 70) { status.classList.add('status-almost'); status.textContent = '🔵 Almost There'; }
        else if (pct >= 40) { status.classList.add('status-getting-there'); status.textContent = '⚠️ Getting There'; }
        else { status.classList.add('status-not-ready'); status.textContent = '❌ Keep Studying'; }
    }
}

function toggleSection(btn) {
    const body = btn.nextElementSibling;
    const arrow = btn.querySelector('.toggle-arrow');
    const isOpen = arrow.classList.toggle('open');
    body.style.display = isOpen ? '' : 'none';
}

function resetCert(certId, total) {
    if (!confirm('Reset all checkboxes for this certification? Your progress will be cleared.')) return;
    const saved = JSON.parse(localStorage.getItem('cns_checklist') || '{}');
    Object.keys(saved).forEach(k => { if (k.startsWith(certId + '_')) delete saved[k]; });
    localStorage.setItem('cns_checklist', JSON.stringify(saved));
    document.querySelectorAll(`#panel_${certId} .check-item`).forEach(el => el.classList.remove('checked'));
    updateProgress(certId, total);
}

init();
</script>
